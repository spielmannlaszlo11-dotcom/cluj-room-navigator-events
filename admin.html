<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room Navigator Event Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #172033;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 34px;
    }

    .subtitle {
      color: #667085;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,.06);
    }

    .hidden {
      display: none !important;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d0d5dd;
      border-radius: 9px;
      font-size: 16px;
      background: white;
    }

    input:focus {
      outline: 2px solid #155eef;
      border-color: transparent;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .full {
      grid-column: 1 / -1;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      background: #155eef;
      color: white;
    }

    .secondary {
      background: #eef2f6;
      color: #172033;
    }

    .danger {
      background: #fee4e2;
      color: #b42318;
    }

    .top-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .button-row {
      margin-top: 22px;
      display: flex;
      gap: 10px;
    }

    #message {
      margin-top: 15px;
      font-weight: 700;
    }

    .success {
      color: #067647;
    }

    .error {
      color: #b42318;
    }

    .event {
      display: grid;
      grid-template-columns: 110px 1fr auto;
      gap: 18px;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid #eaecf0;
    }

    .event:last-child {
      border-bottom: none;
    }

    .thumb {
      width: 110px;
      height: 75px;
      object-fit: contain;
      background: #f2f4f7;
      border-radius: 9px;
    }

    .event-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .event-meta {
      color: #667085;
    }

    .event-actions {
      display: flex;
      gap: 8px;
    }

    .login-box {
      max-width: 460px;
      margin: 80px auto;
    }

    .preview-row {
      display: flex;
      gap: 18px;
      margin-top: 10px;
    }

    .preview-box {
      flex: 1;
    }

    .preview-img {
      width: 100%;
      max-height: 180px;
      object-fit: contain;
      background: #f2f4f7;
      border-radius: 10px;
      display: none;
    }

    @media (max-width: 750px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .event {
        grid-template-columns: 1fr;
      }

      .event-actions {
        justify-content: flex-start;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <div id="loginSection" class="card login-box">
    <h1>Navigator Admin</h1>
    <p class="subtitle">Sign in to manage Room Navigator events.</p>

    <label>Email</label>
    <input id="email" type="email">

    <div style="height:16px"></div>

    <label>Password</label>
    <input id="password" type="password">

    <div class="button-row">
      <button class="primary" onclick="login()">Sign in</button>
    </div>

    <div id="loginMessage"></div>
  </div>


  <div id="adminSection" class="hidden">

    <div class="top-actions">
      <div>
        <h1>Room Navigator Events</h1>
        <div class="subtitle">Cluj event signage management</div>
      </div>

      <button class="secondary" onclick="logout()">Sign out</button>
    </div>


    <div class="card">

      <h2 id="formHeading">Add Event</h2>

      <div class="grid">

        <div>
          <label>Date</label>
          <input id="eventDate" type="date">
        </div>

        <div>
          <label>Event Title</label>
          <input id="title" type="text"
                 placeholder="e.g. FanDuel Event">
        </div>

        <div>
          <label>Start Time</label>
          <input id="startTime" type="time">
        </div>

        <div>
          <label>End Time</label>
          <input id="endTime" type="time">
        </div>

        <div>
          <label>Logo / Department Image</label>
          <input id="logoFile"
                 type="file"
                 accept="image/png,image/jpeg,image/webp">
        </div>

        <div>
          <label>Event Background</label>
          <input id="backgroundFile"
                 type="file"
                 accept="image/png,image/jpeg,image/webp">
        </div>

      </div>


      <div class="preview-row">

        <div class="preview-box">
          <p><strong>Logo preview</strong></p>
          <img id="logoPreview" class="preview-img">
        </div>

        <div class="preview-box">
          <p><strong>Background preview</strong></p>
          <img id="backgroundPreview" class="preview-img">
        </div>

      </div>


      <div class="button-row">

        <button id="saveButton"
                class="primary"
                onclick="saveEvent()">
          Save Event
        </button>

        <button id="cancelEditButton"
                class="secondary hidden"
                onclick="cancelEdit()">
          Cancel Edit
        </button>

      </div>

      <div id="message"></div>

    </div>


    <div class="card">

      <h2>Upcoming Events</h2>

      <div id="eventList">
        Loading...
      </div>

    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  'https://wdcrihymqrbiljncxvbs.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_WRI3MJLwDSP4wJscWdBmhA_t50js1al';

const sb = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let editingEventId = null;
let existingLogoUrl = null;
let existingBackgroundUrl = null;


/* ---------------- AUTH ---------------- */

async function login() {

  const email =
    document.getElementById('email').value.trim();

  const password =
    document.getElementById('password').value;

  const msg =
    document.getElementById('loginMessage');

  msg.textContent = 'Signing in...';

  const { error } =
    await sb.auth.signInWithPassword({
      email,
      password
    });

  if (error) {
    msg.textContent = error.message;
    msg.className = 'error';
    return;
  }

  msg.textContent = '';

  showAdmin();
}


async function logout() {

  await sb.auth.signOut();

  document
    .getElementById('adminSection')
    .classList.add('hidden');

  document
    .getElementById('loginSection')
    .classList.remove('hidden');
}


async function checkSession() {

  const {
    data: { session }
  } =
    await sb.auth.getSession();

  if (session) {
    showAdmin();
  }

}


function showAdmin() {

  document
    .getElementById('loginSection')
    .classList.add('hidden');

  document
    .getElementById('adminSection')
    .classList.remove('hidden');

  setDefaultDate();

  loadEvents();
}


/* ---------------- DATE ---------------- */

function localDateString() {

  const parts =
    new Intl.DateTimeFormat(
      'en-CA',
      {
        timeZone: 'Europe/Bucharest',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      }
    ).formatToParts(new Date());

  const year =
    parts.find(p => p.type === 'year').value;

  const month =
    parts.find(p => p.type === 'month').value;

  const day =
    parts.find(p => p.type === 'day').value;

  return `${year}-${month}-${day}`;
}


function setDefaultDate() {

  if (!document.getElementById('eventDate').value) {
    document.getElementById('eventDate').value =
      localDateString();
  }

}


/* ---------------- FILE UPLOAD ---------------- */

async function uploadFile(file, type) {

  if (!file)
    return null;

  const extension =
    file.name.split('.').pop();

  const filename =
    `${type}/${Date.now()}-${crypto.randomUUID()}.${extension}`;

  const { error } =
    await sb.storage
      .from('event-assets')
      .upload(
        filename,
        file,
        {
          cacheControl: '3600',
          upsert: false
        }
      );

  if (error)
    throw error;

  const { data } =
    sb.storage
      .from('event-assets')
      .getPublicUrl(filename);

  return data.publicUrl;
}


/* ---------------- SAVE EVENT ---------------- */

async function saveEvent() {

  const msg =
    document.getElementById('message');

  msg.textContent = '';
  msg.className = '';

  const eventDate =
    document.getElementById('eventDate').value;

  const title =
    document.getElementById('title').value.trim();

  const startTime =
    document.getElementById('startTime').value;

  const endTime =
    document.getElementById('endTime').value;

  const logoFile =
    document.getElementById('logoFile').files[0];

  const backgroundFile =
    document.getElementById('backgroundFile').files[0];


  if (!eventDate ||
      !title ||
      !startTime ||
      !endTime) {

    msg.textContent =
      'Please complete date, title, start time and end time.';

    msg.className = 'error';

    return;
  }


  if (endTime <= startTime) {

    msg.textContent =
      'End time must be later than start time.';

    msg.className = 'error';

    return;
  }


  try {

    msg.textContent = 'Saving event...';

    let logoUrl =
      existingLogoUrl;

    let backgroundUrl =
      existingBackgroundUrl;


    if (logoFile) {
      logoUrl =
        await uploadFile(
          logoFile,
          'logos'
        );
    }


    if (backgroundFile) {
      backgroundUrl =
        await uploadFile(
          backgroundFile,
          'backgrounds'
        );
    }


    const record = {
      event_date: eventDate,
      start_time: startTime,
      end_time: endTime,
      title: title,
      logo_url: logoUrl,
      background_url: backgroundUrl
    };


    let result;


    if (editingEventId) {

      result =
        await sb
          .from('events')
          .update(record)
          .eq('id', editingEventId);

    } else {

      result =
        await sb
          .from('events')
          .insert(record);

    }


    if (result.error)
      throw result.error;


    msg.textContent =
      editingEventId
        ? 'Event updated successfully.'
        : 'Event created successfully.';

    msg.className = 'success';


    resetForm();

    await loadEvents();


  } catch (error) {

    console.error(error);

    msg.textContent =
      'Error: ' + error.message;

    msg.className = 'error';

  }

}


/* ---------------- LOAD EVENTS ---------------- */

async function loadEvents() {

  const container =
    document.getElementById('eventList');

  container.textContent =
    'Loading...';


  const today =
    localDateString();


  const { data, error } =
    await sb
      .from('events')
      .select('*')
      .gte('event_date', today)
      .order('event_date', {
        ascending: true
      })
      .order('start_time', {
        ascending: true
      });


  if (error) {

    container.innerHTML =
      `<span class="error">${error.message}</span>`;

    return;
  }


  if (!data || data.length === 0) {

    container.innerHTML =
      '<p>No upcoming events.</p>';

    return;
  }


  container.innerHTML = '';


  data.forEach(event => {

    const row =
      document.createElement('div');

    row.className =
      'event';


    const image =
      event.logo_url
        ? `<img class="thumb"
                src="${event.logo_url}">`
        : `<div class="thumb"></div>`;


    row.innerHTML = `

      ${image}

      <div>

        <div class="event-title">
          ${escapeHtml(event.title)}
        </div>

        <div class="event-meta">
          ${event.event_date}
          &nbsp; • &nbsp;
          ${event.start_time.substring(0,5)}
          –
          ${event.end_time.substring(0,5)}
        </div>

      </div>

      <div class="event-actions">

        <button
          class="secondary"
          onclick="editEvent(${event.id})">
          Edit
        </button>

        <button
          class="danger"
          onclick="deleteEvent(${event.id})">
          Delete
        </button>

      </div>

    `;


    container.appendChild(row);

  });

}


/* ---------------- EDIT ---------------- */

async function editEvent(id) {

  const { data, error } =
    await sb
      .from('events')
      .select('*')
      .eq('id', id)
      .single();


  if (error) {
    alert(error.message);
    return;
  }


  editingEventId =
    data.id;

  existingLogoUrl =
    data.logo_url;

  existingBackgroundUrl =
    data.background_url;


  document.getElementById('eventDate').value =
    data.event_date;

  document.getElementById('title').value =
    data.title;

  document.getElementById('startTime').value =
    data.start_time.substring(0,5);

  document.getElementById('endTime').value =
    data.end_time.substring(0,5);


  if (data.logo_url) {

    const img =
      document.getElementById('logoPreview');

    img.src =
      data.logo_url;

    img.style.display =
      'block';

  }


  if (data.background_url) {

    const img =
      document.getElementById('backgroundPreview');

    img.src =
      data.background_url;

    img.style.display =
      'block';

  }


  document.getElementById('formHeading').textContent =
    'Edit Event';

  document.getElementById('saveButton').textContent =
    'Update Event';

  document
    .getElementById('cancelEditButton')
    .classList.remove('hidden');


  window.scrollTo({
    top: 0,
    behavior: 'smooth'
  });

}


/* ---------------- DELETE ---------------- */

async function deleteEvent(id) {

  if (!confirm(
    'Are you sure you want to delete this event?'
  )) {
    return;
  }


  const { error } =
    await sb
      .from('events')
      .delete()
      .eq('id', id);


  if (error) {
    alert(error.message);
    return;
  }


  await loadEvents();

}


/* ---------------- RESET ---------------- */

function resetForm() {

  editingEventId = null;
  existingLogoUrl = null;
  existingBackgroundUrl = null;


  document.getElementById('title').value = '';
  document.getElementById('startTime').value = '';
  document.getElementById('endTime').value = '';

  document.getElementById('logoFile').value = '';
  document.getElementById('backgroundFile').value = '';

  document.getElementById('logoPreview').style.display =
    'none';

  document.getElementById('backgroundPreview').style.display =
    'none';


  document.getElementById('formHeading').textContent =
    'Add Event';

  document.getElementById('saveButton').textContent =
    'Save Event';

  document
    .getElementById('cancelEditButton')
    .classList.add('hidden');


  setDefaultDate();

}


function cancelEdit() {

  resetForm();

  document.getElementById('message').textContent = '';

}


/* ---------------- PREVIEW ---------------- */

document
  .getElementById('logoFile')
  .addEventListener(
    'change',
    function () {

      previewFile(
        this,
        'logoPreview'
      );

    }
  );


document
  .getElementById('backgroundFile')
  .addEventListener(
    'change',
    function () {

      previewFile(
        this,
        'backgroundPreview'
      );

    }
  );


function previewFile(input, imageId) {

  const file =
    input.files[0];

  if (!file)
    return;


  const img =
    document.getElementById(imageId);

  img.src =
    URL.createObjectURL(file);

  img.style.display =
    'block';

}


/* ---------------- SAFETY ---------------- */

function escapeHtml(value) {

  const div =
    document.createElement('div');

  div.textContent =
    value;

  return div.innerHTML;

}


checkSession();

</script>

</body>
</html>
