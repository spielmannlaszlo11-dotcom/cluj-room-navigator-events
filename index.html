<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Room Navigator Events</title>

  <style>

    /* =========================================================
       FLUTTER COLORS
       ========================================================= */

    :root {
      --flutter-navy: #16215B;
      --flutter-blue: #0285FF;
      --sky-blue: #CCE5FF;
      --dark-navy: #0B112E;

      --flutter-red: #D5225D;
      --flutter-yellow: #F8CD4B;

      --white: #FFFFFF;
    }


    /* =========================================================
       GLOBAL
       ========================================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html,
    body {
      width: 100%;
      height: 100%;

      overflow: hidden;

      background: var(--dark-navy);

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: var(--white);

      -webkit-user-select: none;
      user-select: none;
    }


    #app {
      position: relative;

      width: 100vw;
      height: 100vh;

      overflow: hidden;
    }


    /* =========================================================
       IDLE SCREEN
       ========================================================= */

    .idle-screen {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;

      overflow: hidden;
    }


    .idle-screen::before {
      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          90deg,
          rgba(11,17,46,0.54) 0%,
          rgba(11,17,46,0.34) 52%,
          rgba(11,17,46,0.40) 100%
        );

      pointer-events: none;

      z-index: 1;
    }


    .idle-content {
      position: relative;

      width: 100%;
      height: 100%;

      z-index: 2;
    }


    /* =========================================================
       DATE — TOP RIGHT
       NO BOLD
       ========================================================= */

    .date-block {
      position: absolute;

      top: 70px;
      right: 95px;

      text-align: right;

      line-height: 1;
    }


    .date-day {
      color: var(--sky-blue);

      font-size: 44px;

      font-weight: 400;

      letter-spacing: 0.01em;

      margin-bottom: 14px;
    }


    .date-date {
      color: var(--white);

      font-size: 64px;

      font-weight: 400;

      letter-spacing: -0.02em;
    }


    /* =========================================================
       AVAILABLE ALL DAY
       ========================================================= */

    .no-events-wrapper {
      position: absolute;
      inset: 0;

      display: flex;

      align-items: center;
      justify-content: center;

      pointer-events: none;
    }


    .no-events {
      text-align: center;

      color: var(--white);

      font-size: 82px;

      font-weight: 400;

      letter-spacing: -0.02em;
    }


    .no-events-line {
      width: 150px;

      height: 8px;

      margin: 28px auto 0;

      background: var(--flutter-yellow);

      border-radius: 20px;
    }


    /* =========================================================
       DAILY EVENT SCHEDULE
       ALSO NO BOLD
       ========================================================= */

    .schedule-wrapper {
      position: absolute;

      left: 90px;
      right: 90px;

      top: 255px;
      bottom: 65px;

      display: flex;

      align-items: flex-start;
    }


    .schedule {
      width: 100%;

      display: flex;
      flex-direction: column;

      gap: 22px;
    }


    .schedule-row {
      width: 100%;

      display: grid;

      grid-template-columns:
        330px
        minmax(0, 1fr);

      align-items: center;

      min-height: 112px;

      padding:
        22px
        36px;

      background:
        rgba(11,17,46,0.60);

      border-left:
        8px solid
        var(--flutter-blue);

      border-radius:
        0
        18px
        18px
        0;

      backdrop-filter:
        blur(12px);
    }


    .schedule-time {
      color: var(--flutter-yellow);

      font-size: 48px;

      font-weight: 400;

      line-height: 1.05;

      white-space: nowrap;
    }


    .schedule-title {
      color: var(--white);

      font-size: 52px;

      font-weight: 400;

      line-height: 1.10;

      padding-left: 34px;

      white-space: normal;

      overflow-wrap: break-word;

      word-break: normal;
    }


    /* =========================================================
       ACTIVE EVENT SCREEN
       ========================================================= */

    .event-screen {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      display: grid;

      grid-template-columns:
        50% 50%;

      background:
        var(--dark-navy);
    }


    /* =========================================================
       LEFT SIDE — LOGO / DEPARTMENT IMAGE
       ========================================================= */

    .event-left {
      position: relative;

      width: 100%;
      height: 100%;

      display: flex;

      align-items: center;
      justify-content: center;

      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 45%,
          rgba(2,133,255,0.22),
          rgba(22,33,91,0.38) 45%,
          rgba(11,17,46,1) 88%
        );
    }


    .event-left::after {
      content: "";

      position: absolute;

      top: 0;
      right: -20px;

      width: 40px;
      height: 100%;

      background:
        linear-gradient(
          90deg,
          rgba(11,17,46,0),
          rgba(11,17,46,0.75),
          rgba(11,17,46,0)
        );

      filter: blur(10px);

      pointer-events: none;

      z-index: 5;
    }


    .event-logo {
      width: 88%;
      height: 88%;

      object-fit: contain;

      object-position: center;

      position: relative;

      z-index: 2;

      filter:
        drop-shadow(
          0 28px 38px
          rgba(0,0,0,0.30)
        );
    }


    .event-logo-placeholder {
      width: 80%;
      height: 80%;

      display: flex;

      align-items: center;
      justify-content: center;

      text-align: center;

      color:
        var(--sky-blue);

      font-size: 62px;

      font-weight: 700;
    }


    /* =========================================================
       RIGHT EVENT BACKGROUND
       ========================================================= */

    .event-right {
      position: relative;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;

      display: grid;

      grid-template-rows:
        56% 44%;
    }


    .event-right::before {
      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          135deg,
          rgba(11,17,46,0.40) 0%,
          rgba(11,17,46,0.20) 45%,
          rgba(11,17,46,0.48) 100%
        );

      pointer-events: none;

      z-index: 1;
    }


    /* =========================================================
       ACTIVE EVENT TITLE + TIME
       ========================================================= */

    .event-top {
      position: relative;

      z-index: 2;

      display: flex;

      flex-direction: column;

      justify-content: flex-start;

      padding:
        110px
        80px
        40px;
    }


    .event-title {
      color:
        var(--white);

      font-size: 98px;

      font-weight: 700;

      line-height: 0.98;

      letter-spacing:
        -0.035em;

      overflow-wrap:
        break-word;

      max-width: 100%;
    }


    .event-time {
      color:
        var(--flutter-yellow);

      font-size: 54px;

      font-weight: 700;

      margin-top: 28px;
    }


    /* =========================================================
       IN PROGRESS
       ========================================================= */

    .event-bottom {
      position: relative;

      z-index: 2;

      display: flex;

      align-items: center;
      justify-content: center;

      padding:
        45px
        70px
        65px;
    }


    .progress-box {
      width: 100%;

      height: 78%;

      min-height: 230px;

      display: flex;

      align-items: center;
      justify-content: center;

      border:
        5px solid
        rgba(213,34,93,0.96);

      border-radius:
        28px;

      background:
        linear-gradient(
          135deg,
          rgba(95,8,36,0.88),
          rgba(38,5,20,0.95)
        );

      box-shadow:
        0 0 50px
        rgba(213,34,93,0.19);

      overflow: hidden;
    }


    .progress-text {
      color:
        var(--white);

      font-size:
        clamp(
          82px,
          5.7vw,
          110px
        );

      font-weight: 700;

      line-height: 1;

      letter-spacing:
        0.015em;

      text-align: center;

      width: 85%;

      white-space: nowrap;
    }


    /* =========================================================
       ERROR
       ========================================================= */

    .system-message {
      position: absolute;
      inset: 0;

      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;

      background:
        var(--dark-navy);

      padding: 60px;
    }


    .system-message h1 {
      font-size: 70px;

      margin-bottom: 25px;
    }


    .system-message p {
      color:
        var(--sky-blue);

      font-size: 36px;
    }


    /* =========================================================
       SMALLER SCREEN FALLBACK
       ========================================================= */

    @media (max-width: 1500px) {

      .date-block {
        top: 50px;
        right: 65px;
      }


      .date-day {
        font-size: 34px;
        font-weight: 400;
      }


      .date-date {
        font-size: 50px;
        font-weight: 400;
      }


      .schedule-wrapper {
        left: 65px;
        right: 65px;

        top: 210px;
      }


      .schedule-row {
        grid-template-columns:
          270px
          minmax(0,1fr);
      }


      .schedule-time {
        font-size: 38px;
        font-weight: 400;
      }


      .schedule-title {
        font-size: 42px;
        font-weight: 400;
      }


      .no-events {
        font-size: 68px;
        font-weight: 400;
      }


      .event-top {
        padding:
          85px
          65px
          35px;
      }


      .event-title {
        font-size: 82px;
      }


      .event-time {
        font-size: 46px;
      }


      .progress-text {
        font-size:
          clamp(
            70px,
            5.6vw,
            92px
          );
      }

    }

  </style>

</head>


<body>

  <div id="app"></div>


  <script>

    /* =========================================================
       SUPABASE
       ========================================================= */

    const SUPABASE_URL =
      "https://wdcrihymqrbiljncxvbs.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_WRI3MJLwDSP4wJscWdBmhA_t50js1al";


    /* =========================================================
       IDLE BACKGROUND
       ========================================================= */

    const IDLE_BACKGROUND_URL =
      SUPABASE_URL +
      "/storage/v1/object/public/event-assets/idle/idle-background";


    /* =========================================================
       SETTINGS
       ========================================================= */

    const TIME_ZONE =
      "Europe/Bucharest";


    const EVENT_REFRESH_INTERVAL =
      15000;


    const SCREEN_REFRESH_INTERVAL =
      1000;


    /* =========================================================
       STATE
       ========================================================= */

    let todayEvents = [];

    let lastLoadedDate = null;


    /* =========================================================
       DATE / TIME
       ========================================================= */

    function getBucharestParts() {

      const formatter =
        new Intl.DateTimeFormat(
          "en-GB",
          {

            timeZone:
              TIME_ZONE,

            year:
              "numeric",

            month:
              "2-digit",

            day:
              "2-digit",

            weekday:
              "long",

            hour:
              "2-digit",

            minute:
              "2-digit",

            second:
              "2-digit",

            hour12:
              false

          }
        );


      const parts =
        formatter.formatToParts(
          new Date()
        );


      const values = {};


      for (const part of parts) {

        if (
          part.type !== "literal"
        ) {

          values[part.type] =
            part.value;

        }

      }


      return values;

    }


    function getTodayDateString() {

      const p =
        getBucharestParts();


      return (
        p.year +
        "-" +
        p.month +
        "-" +
        p.day
      );

    }


    function getCurrentMinutes() {

      const p =
        getBucharestParts();


      return (
        Number(p.hour) * 60 +
        Number(p.minute)
      );

    }


    function getDisplayDate() {

      const now =
        new Date();


      const weekday =
        new Intl.DateTimeFormat(
          "en-GB",
          {

            timeZone:
              TIME_ZONE,

            weekday:
              "long"

          }
        )
        .format(now);


      const date =
        new Intl.DateTimeFormat(
          "en-GB",
          {

            timeZone:
              TIME_ZONE,

            day:
              "numeric",

            month:
              "long"

          }
        )
        .format(now);


      return {

        weekday,
        date

      };

    }


    /* =========================================================
       TIME HELPERS
       ========================================================= */

    function timeToMinutes(
      timeString
    ) {

      if (!timeString) {
        return 0;
      }


      const parts =
        timeString
          .split(":")
          .map(Number);


      const hours =
        parts[0] || 0;


      const minutes =
        parts[1] || 0;


      return (
        hours * 60 +
        minutes
      );

    }


    function formatTime(
      timeString
    ) {

      if (!timeString) {
        return "";
      }


      return (
        timeString.substring(
          0,
          5
        )
      );

    }


    /* =========================================================
       ESCAPE HTML
       ========================================================= */

    function escapeHtml(
      value
    ) {

      if (
        value === null ||
        value === undefined
      ) {

        return "";

      }


      return String(value)

        .replaceAll(
          "&",
          "&amp;"
        )

        .replaceAll(
          "<",
          "&lt;"
        )

        .replaceAll(
          ">",
          "&gt;"
        )

        .replaceAll(
          '"',
          "&quot;"
        )

        .replaceAll(
          "'",
          "&#039;"
        );

    }


    /* =========================================================
       LOAD EVENTS
       ========================================================= */

    async function loadEvents() {

      const today =
        getTodayDateString();


      try {

        const url =

          SUPABASE_URL +

          "/rest/v1/events" +

          "?select=*" +

          "&event_date=eq." +

          encodeURIComponent(
            today
          ) +

          "&order=start_time.asc";


        const response =
          await fetch(
            url,
            {

              method:
                "GET",

              headers: {

                "apikey":
                  SUPABASE_KEY,

                "Accept":
                  "application/json"

              },

              cache:
                "no-store"

            }
          );


        if (!response.ok) {

          throw new Error(
            "Supabase returned " +
            response.status
          );

        }


        todayEvents =
          await response.json();


        lastLoadedDate =
          today;


        render();


      }

      catch (error) {

        console.error(
          "Could not load events:",
          error
        );


        renderError(
          "Unable to load events"
        );

      }

    }


    /* =========================================================
       FIND CURRENT EVENT
       ========================================================= */

    function getCurrentEvent() {

      const now =
        getCurrentMinutes();


      return todayEvents.find(
        event => {

          const start =
            timeToMinutes(
              event.start_time
            );


          const end =
            timeToMinutes(
              event.end_time
            );


          return (

            now >= start &&

            now < end

          );

        }
      );

    }


    /* =========================================================
       DATE BLOCK
       ========================================================= */

    function getDateBlockHtml() {

      const displayDate =
        getDisplayDate();


      return `

        <div class="date-block">

          <div class="date-day">

            ${escapeHtml(
              displayDate.weekday
            )}

          </div>

          <div class="date-date">

            ${escapeHtml(
              displayDate.date
            )}

          </div>

        </div>

      `;

    }


    /* =========================================================
       IDLE MODE
       ========================================================= */

    function renderIdle() {

      const app =
        document.getElementById(
          "app"
        );


      const background =

        IDLE_BACKGROUND_URL +

        "?v=" +

        Math.floor(
          Date.now() /
          60000
        );


      const dateHtml =
        getDateBlockHtml();


      /* =======================================================
         NO EVENTS
         ======================================================= */

      if (

        !Array.isArray(
          todayEvents
        ) ||

        todayEvents.length === 0

      ) {


        app.innerHTML = `

          <section

            class="idle-screen"

            style="
              background-image:
              url('${background}');
            "

          >


            <div class="idle-content">


              ${dateHtml}


              <div
                class="no-events-wrapper"
              >


                <div
                  class="no-events"
                >

                  Available all day


                  <div
                    class="no-events-line"
                  ></div>


                </div>


              </div>


            </div>


          </section>

        `;


        return;

      }


      /* =======================================================
         EVENTS TODAY
         ======================================================= */

      const scheduleHtml =

        todayEvents

          .map(
            event => {

              return `

                <div
                  class="schedule-row"
                >


                  <div
                    class="schedule-time"
                  >

                    ${escapeHtml(
                      formatTime(
                        event.start_time
                      )
                    )}

                    –

                    ${escapeHtml(
                      formatTime(
                        event.end_time
                      )
                    )}

                  </div>


                  <div
                    class="schedule-title"
                  >

                    ${escapeHtml(
                      event.title
                    )}

                  </div>


                </div>

              `;

            }
          )

          .join("");


      app.innerHTML = `

        <section

          class="idle-screen"

          style="
            background-image:
            url('${background}');
          "

        >


          <div class="idle-content">


            ${dateHtml}


            <div
              class="schedule-wrapper"
            >


              <div
                class="schedule"
              >

                ${scheduleHtml}

              </div>


            </div>


          </div>


        </section>

      `;

    }


    /* =========================================================
       ACTIVE EVENT MODE
       ========================================================= */

    function renderActiveEvent(
      event
    ) {

      const app =
        document.getElementById(
          "app"
        );


      const logo =
        event.logo_url || "";


      const background =
        event.background_url || "";


      let logoHtml;


      if (logo) {

        logoHtml = `

          <img

            class="event-logo"

            src="${escapeHtml(
              logo
            )}"

            alt=""

          >

        `;

      }

      else {

        logoHtml = `

          <div
            class="event-logo-placeholder"
          >

            ${escapeHtml(
              event.title
            )}

          </div>

        `;

      }


      const rightStyle =

        background

          ?

          `
            background-image:
              url('${escapeHtml(
                background
              )}');
          `

          :

          `
            background:
              linear-gradient(
                145deg,
                #16215B 0%,
                #0285FF 100%
              );
          `;


      app.innerHTML = `

        <section
          class="event-screen"
        >


          <div
            class="event-left"
          >

            ${logoHtml}

          </div>


          <div

            class="event-right"

            style="
              ${rightStyle}
            "

          >


            <div
              class="event-top"
            >


              <div
                class="event-title"
              >

                ${escapeHtml(
                  event.title
                )}

              </div>


              <div
                class="event-time"
              >

                ${escapeHtml(
                  formatTime(
                    event.start_time
                  )
                )}

                –

                ${escapeHtml(
                  formatTime(
                    event.end_time
                  )
                )}

              </div>


            </div>


            <div
              class="event-bottom"
            >


              <div
                class="progress-box"
              >


                <div
                  class="progress-text"
                >

                  IN PROGRESS

                </div>


              </div>


            </div>


          </div>


        </section>

      `;

    }


    /* =========================================================
       ERROR
       ========================================================= */

    function renderError(
      message
    ) {

      const app =
        document.getElementById(
          "app"
        );


      app.innerHTML = `

        <div
          class="system-message"
        >


          <h1>
            Event Display
          </h1>


          <p>

            ${escapeHtml(
              message
            )}

          </p>


        </div>

      `;

    }


    /* =========================================================
       MAIN RENDER
       ========================================================= */

    function render() {

      const today =
        getTodayDateString();


      if (

        lastLoadedDate &&

        today !==
        lastLoadedDate

      ) {

        loadEvents();

        return;

      }


      const activeEvent =
        getCurrentEvent();


      if (activeEvent) {

        renderActiveEvent(
          activeEvent
        );

      }

      else {

        renderIdle();

      }

    }


    /* =========================================================
       START
       ========================================================= */

    async function start() {

      await loadEvents();


      setInterval(

        render,

        SCREEN_REFRESH_INTERVAL

      );


      setInterval(

        loadEvents,

        EVENT_REFRESH_INTERVAL

      );

    }


    start();

  </script>

</body>

</html>
