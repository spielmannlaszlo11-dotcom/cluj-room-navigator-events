<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Room Navigator Events</title>

  <style>

    :root {

      --flutter-navy: #16215B;
      --flutter-blue: #0285FF;
      --sky-blue: #CCE5FF;
      --dark-navy: #0B112E;

      --flutter-red: #D5225D;
      --flutter-yellow: #F8CD4B;

      --white: #FFFFFF;

    }


    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html,
    body {

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: var(--dark-navy);

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: var(--white);

      -webkit-user-select: none;
      user-select: none;

    }


    #app {

      width: 100vw;
      height: 100vh;

      position: relative;

      overflow: hidden;

    }



    /* =========================================================
       IDLE
       ========================================================= */

    .idle-screen {

      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;

      overflow: hidden;

    }


    .idle-screen::before {

      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          90deg,
          rgba(11,17,46,0.48) 0%,
          rgba(11,17,46,0.24) 55%,
          rgba(11,17,46,0.32) 100%
        );

      pointer-events: none;

      z-index: 1;

    }


    .idle-content {

      position: relative;

      width: 100%;
      height: 100%;

      z-index: 2;

    }



    /* CLOCK + DATE */

    .date-block {

      position: absolute;

      top: 40px;
      right: 55px;

      text-align: right;

      z-index: 20;

    }


    .idle-clock {

      color: var(--white);

      font-size: 68px;

      font-weight: 400;

      line-height: 1;

      margin-bottom: 16px;

    }


    .date-single-line {

      color: var(--white);

      font-size: 32px;

      font-weight: 400;

      white-space: nowrap;

    }



    /* AVAILABLE */

    .no-events-wrapper {

      position: absolute;
      inset: 0;

      display: flex;

      justify-content: center;
      align-items: center;

    }


    .no-events {

      color: var(--white);

      font-size: 60px;

      font-weight: 400;

      text-align: center;

    }


    .no-events-line {

      width: 145px;
      height: 7px;

      margin: 28px auto 0;

      background:
        var(--flutter-yellow);

      border-radius: 20px;

    }



    /* EVENT LIST */

    .schedule-wrapper {

      position: absolute;

      left: 55px;
      right: 55px;

      top: var(--list-top);

      bottom: 45px;

      transform:
        translateX(
          var(--list-x)
        );

    }


    .schedule {

      width: 100%;

      display: flex;

      flex-direction: column;

      gap:
        var(--row-gap);

    }


    .schedule-row {

      width: 100%;

      display: grid;

      grid-template-columns:
        250px
        minmax(0, 1fr);

      align-items: center;

      min-height: 92px;

      padding:
        18px
        28px;

      background:
        rgba(11,17,46,0.60);

      border-left:
        7px solid
        var(--flutter-blue);

      border-radius:
        0
        14px
        14px
        0;

    }


    .schedule-time {

      color:
        var(--flutter-yellow);

      font-size:
        var(--time-size);

      font-weight:
        var(--time-weight);

      line-height: 1.05;

      white-space: nowrap;

      transform:
        translate(
          var(--time-x),
          var(--time-y)
        );

    }


    .schedule-title {

      color:
        var(--white);

      font-size:
        var(--title-size);

      font-weight:
        var(--title-weight);

      line-height: 1.10;

      padding-left: 60px;

      white-space: normal;

      overflow-wrap: break-word;

      transform:
        translate(
          var(--title-x),
          var(--title-y)
        );

    }



    /* =========================================================
       ACTIVE EVENT
       ========================================================= */

    .event-screen {

      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      display: grid;

      grid-template-columns:
        50% 50%;

      background:
        var(--dark-navy);

    }

      position: relative;

      width: 100%;
      height: 100%;

      overflow
