<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Room Navigator Events</title>


  <style>

    /* =========================================================
       COLORS
       ========================================================= */

    :root {

      --flutter-navy: #16215B;
      --flutter-blue: #0285FF;
      --sky-blue: #CCE5FF;
      --dark-navy: #0B112E;

      --flutter-red: #D5225D;
      --flutter-yellow: #F8CD4B;

      --white: #FFFFFF;

    }



    /* =========================================================
       GLOBAL
       ========================================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html,
    body {

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: var(--dark-navy);

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: var(--white);

      -webkit-user-select: none;
      user-select: none;

    }


    #app {

      position: relative;

      width: 100vw;
      height: 100vh;

      overflow: hidden;

    }



    /* =========================================================
       IDLE SCREEN
       ========================================================= */

    .idle-screen {

      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;

      overflow: hidden;

    }


    .idle-screen::before {

      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          90deg,
          rgba(11,17,46,0.54) 0%,
          rgba(11,17,46,0.34) 52%,
          rgba(11,17,46,0.40) 100%
        );

      pointer-events: none;

      z-index: 1;

    }


    .idle-content {

      position: relative;

      width: 100%;
      height: 100%;

      z-index: 2;

    }



    /* =========================================================
       IDLE CLOCK + DATE
       ========================================================= */

    .date-block {

      position: absolute;

      top: 55px;
      right: 90px;

      text-align: right;

      line-height: 1;

    }


    .idle-clock {

      color: var(--white);

      letter-spacing: -0.025em;

      margin-bottom: 20px;

      position: relative;

      white-space: nowrap;

    }


    .date-single-line {

      color: var(--white);

      letter-spacing: -0.01em;

      white-space: nowrap;

      position: relative;

    }



    /* =========================================================
       AVAILABLE ALL DAY
       ========================================================= */

    .no-events-wrapper {

      position: absolute;
      inset: 0;

      display: flex;

      align-items: center;
      justify-content: center;

      pointer-events: none;

    }


    .no-events {

      text-align: center;

      color: var(--white);

      letter-spacing: -0.02em;

      position: relative;

    }


    .no-events-line {

      width: 145px;
      height: 7px;

      margin: 28px auto 0;

      background: var(--flutter-yellow);

      border-radius: 20px;

    }



    /* =========================================================
       IDLE EVENT LIST
       ========================================================= */

    .schedule-wrapper {

      position: absolute;

      left: 90px;
      right: 90px;

      top: 255px;
      bottom: 65px;

      display: flex;

      align-items: flex-start;

      /*
         IMPORTANT:
         X/Y movement from Admin is applied here.
      */

      transform:
        translate(
          var(--schedule-x, 0px),
          var(--schedule-y, 0px)
        );

    }


    .schedule {

      width: 100%;

      display: flex;
      flex-direction: column;

      gap: 22px;

    }


    .schedule-row {

      width: 100%;

      display: grid;

      grid-template-columns:
        330px
        minmax(0, 1fr);

      align-items: center;

      min-height: 112px;

      padding:
        22px
        36px;

      background:
        rgba(11,17,46,0.60);

      border-left:
        8px solid
        var(--flutter-blue);

      border-radius:
        0
        18px
        18px
        0;

    }


    .schedule-time {

      color:
        var(--flutter-yellow);

      line-height: 1.05;

      white-space: nowrap;

    }


    .schedule-title {

      color:
        var(--white);

      line-height: 1.10;

      padding-left: 34px;

      white-space: normal;

      overflow-wrap: break-word;

      word-break: normal;

    }



    /* =========================================================
       ACTIVE EVENT
       ========================================================= */

    .event-screen {

      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      display: grid;

      grid-template-columns:
        50% 50%;

      background:
        var(--dark-navy);

    }



    /* =========================================================
       LEFT EVENT IMAGE
       960 x 1200 fills the entire panel
       ========================================================= */

    .event-left {

      position: relative;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background:
        var(--dark-navy);

    }


    .event-logo {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center;

      display: block;

      max-width: none;
      max-height: none;

      filter: none;

    }


    .event-left::after {

      content: "";

      position: absolute;

      top: 0;
      right: -18px;

      width: 36px;
      height: 100%;

      background:
        linear-gradient(
          90deg,
          rgba(11,17,46,0),
          rgba(11,17,46,0.55),
          rgba(11,17,46,0)
        );

      filter: blur(8px);

      pointer-events: none;

      z-index: 5;

    }


    .event-logo-placeholder {

      width: 100%;
      height: 100%;

      display: flex;

      align-items: center;
      justify-content: center;

      text-align: center;

      color:
        var(--sky-blue);

      font-size: 62px;

      font-weight: 700;

      padding: 60px;

    }



    /* =========================================================
       RIGHT EVENT BACKGROUND
       ========================================================= */

    .event-right {

      position: relative;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;

      display: grid;

      grid-template-rows:
        56% 44%;

    }


    .event-right::before {

      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          135deg,
          rgba(11,17,46,0.40) 0%,
          rgba(11,17,46,0.20) 45%,
          rgba(11,17,46,0.48) 100%
        );

      pointer-events: none;

      z-index: 1;

    }



    /* =========================================================
       EVENT TITLE + TIME
       ========================================================= */

    .event-top {

      position: relative;

      z-index: 2;

      display: flex;
      flex-direction: column;

      justify-content: flex-start;

      padding:
        85px
        80px
        35px;

    }


    .event-title {

      color:
        var(--white);

      line-height: 0.98;

      letter-spacing:
        -0.035em;

      overflow-wrap:
        break-word;

      position: relative;

      max-width: 100%;

    }


    .event-time {

      color:
        var(--flutter-yellow);

      margin-top: 28px;

      position: relative;

    }



    /* =========================================================
       IN PROGRESS
       ========================================================= */

    .event-bottom {

      position: relative;

      z-index: 2;

      display: flex;

      align-items: center;
      justify-content: center;

      padding:
        45px
        70px
        65px;

    }


    .progress-box {

      width: 100%;

      height: 78%;

      min-height: 230px;

      display: flex;

      align-items: center;
      justify-content: center;

      border:
        5px solid
        rgba(213,34,93,0.96);

      border-radius:
        28px;

      background:
        linear-gradient(
          135deg,
          rgba(95,8,36,0.88),
          rgba(38,5,20,0.95)
        );

      overflow: hidden;

    }


    /*
       IMPORTANT:

       NO hard-coded font-size here anymore.

       Admin controls the actual size.
    */

    .progress-text {

      color:
        var(--white);

      line-height: 1;

      text-align: center;

      white-space: nowrap;

      position: relative;

      max-width: 92%;

    }



    /* =========================================================
       ERROR
       ========================================================= */

    .system-message {

      position: absolute;
      inset: 0;

      display: flex;

      align-items: center;
      justify-content: center;

      text-align: center;

      background:
        var(--dark-navy);

      color:
        var(--white);

      font-size: 40px;

      padding: 60px;

    }



    /* =========================================================
       NAVIGATOR / SMALLER SCREEN
       ========================================================= */

    @media (max-width: 1500px) {

      .date-block {

        top: 40px;
        right: 55px;

      }


      .schedule-wrapper {

        left: 55px;
        right: 55px;

        top: 190px;

      }


      .schedule-row {

        grid-template-columns:
          250px
          minmax(0,1fr);

      }


      .event-top {

        padding:
          65px
          55px
          30px;

      }


      .event-bottom {

        padding:
          35px
          50px
          55px;

      }

    }

  </style>

</head>



<body>

<div id="app"></div>


<script>


  /* =========================================================
     SUPABASE
     ========================================================= */

  const SUPABASE_URL =
    "https://wdcrihymqrbiljncxvbs.supabase.co";


  const SUPABASE_KEY =
    "sb_publishable_WRI3MJLwDSP4wJscWdBmhA_t50js1al";


  const IDLE_BACKGROUND_URL =
    SUPABASE_URL +
    "/storage/v1/object/public/event-assets/idle/idle-background";


  const DISPLAY_SETTINGS_URL =
    SUPABASE_URL +
    "/storage/v1/object/public/event-assets/settings/display-settings.json";


  const TIME_ZONE =
    "Europe/Bucharest";


  const EVENT_REFRESH_INTERVAL =
    15000;


  const SETTINGS_REFRESH_INTERVAL =
    3000;



  /* =========================================================
     STATE
     ========================================================= */

  let todayEvents =
    [];


  let lastLoadedDate =
    null;



  /* =========================================================
     DEFAULT DISPLAY SETTINGS
     ========================================================= */

  const DEFAULT_DISPLAY_SETTINGS = {

    eventTitle: {

      size: 98,

      x: 0,

      y: 0,

      bold: true

    },


    eventTime: {

      size: 54,

      x: 0,

      y: 0,

      bold: true

    },


    progressText: {

      size: 64,

      x: 0,

      y: 0,

      bold: true

    },


    idleClock: {

      size: 82,

      x: 0,

      y: 0,

      bold: false

    },


    idleDate: {

      size: 38,

      x: 0,

      y: 0,

      bold: false

    },


    idleAvailable: {

      size: 72,

      x: 0,

      y: 0,

      bold: false

    },


    /*
       NEW

       Entire idle event list can move
       together up/down/left/right.
    */

    idleSchedule: {

      x: 0,

      y: 0,

      timeSize: 48,

      titleSize: 52,

      timeBold: false,

      titleBold: false

    }

  };


  let displaySettings =
    JSON.parse(
      JSON.stringify(
        DEFAULT_DISPLAY_SETTINGS
      )
    );



  /* =========================================================
     MERGE SETTINGS
     ========================================================= */

  function mergeDisplaySettings(saved) {

    return {

      eventTitle:
        Object.assign(
          {},
          DEFAULT_DISPLAY_SETTINGS.eventTitle,
          saved.eventTitle || {}
        ),


      eventTime:
        Object.assign(
          {},
          DEFAULT_DISPLAY_SETTINGS.eventTime,
          saved.eventTime || {}
        ),


      progressText:
        Object.assign(
          {},
          DEFAULT_DISPLAY_SETTINGS.progressText,
          saved.progressText || {}
        ),


      idleClock:
        Object.assign(
          {},
          DEFAULT_DISPLAY_SETTINGS.idleClock,
          saved.idleClock || {}
        ),


      idleDate:
        Object.assign(
          {},
          DEFAULT_DISPLAY_SETTINGS.idleDate,
          saved.idleDate || {}
        ),


      idleAvailable:
        Object.assign(
          {},
          DEFAULT_DISPLAY_SETTINGS.idleAvailable,
          saved.idleAvailable || {}
        ),


      idleSchedule:
        Object.assign(
          {},
          DEFAULT_DISPLAY_SETTINGS.idleSchedule,
          saved.idleSchedule || {}
        )

    };

  }



  /* =========================================================
     LOAD DISPLAY SETTINGS
     ========================================================= */

  async function loadDisplaySettings() {

    try {

      const response =
        await fetch(

          DISPLAY_SETTINGS_URL +
          "?v=" +
          Date.now(),

          {

            cache:
              "no-store"

          }

        );


      if (!response.ok) {

        return;

      }


      const saved =
        await response.json();


      displaySettings =
        mergeDisplaySettings(
          saved
        );


      /*
         IMPORTANT FIX:

         Immediately redraw screen after
         receiving new Admin settings.
      */

      render();


    }

    catch (error) {

      console.log(
        "Using existing display settings."
      );

    }

  }



  /* =========================================================
     STYLE HELPERS
     ========================================================= */

  function textStyle(name) {

    const s =
      displaySettings[name];


    if (!s) {
      return "";
    }


    const size =
      Number(s.size);


    const x =
      Number(s.x);


    const y =
      Number(s.y);


    return `

      font-size:
        ${Number.isFinite(size) ? size : 40}px;

      font-weight:
        ${s.bold ? 700 : 400};

      transform:
        translate(
          ${Number.isFinite(x) ? x : 0}px,
          ${Number.isFinite(y) ? y : 0}px
        );

    `;

  }



  function scheduleWrapperStyle() {

    const s =
      displaySettings.idleSchedule;


    const x =
      Number(s.x);


    const y =
      Number(s.y);


    return `

      --schedule-x:
        ${Number.isFinite(x) ? x : 0}px;

      --schedule-y:
        ${Number.isFinite(y) ? y : 0}px;

    `;

  }



  function scheduleTimeStyle() {

    const s =
      displaySettings.idleSchedule;


    const size =
      Number(s.timeSize);


    return `

      font-size:
        ${Number.isFinite(size) ? size : 48}px;

      font-weight:
        ${s.timeBold ? 700 : 400};

    `;

  }



  function scheduleTitleStyle() {

    const s =
      displaySettings.idleSchedule;


    const size =
      Number(s.titleSize);


    return `

      font-size:
        ${Number.isFinite(size) ? size : 52}px;

      font-weight:
        ${s.titleBold ? 700 : 400};

    `;

  }



  /* =========================================================
     DATE / TIME
     ========================================================= */

  function getBucharestParts() {

    const formatter =
      new Intl.DateTimeFormat(
        "en-GB",
        {

          timeZone:
            TIME_ZONE,

          year:
            "numeric",

          month:
            "2-digit",

          day:
            "2-digit",

          hour:
            "2-digit",

          minute:
            "2-digit",

          second:
            "2-digit",

          hour12:
            false

        }
      );


    const parts =
      formatter.formatToParts(
        new Date()
      );


    const values = {};


    parts.forEach(
      function(part) {

        if (
          part.type !==
          "literal"
        ) {

          values[part.type] =
            part.value;

        }

      }
    );


    return values;

  }



  function getTodayDateString() {

    const p =
      getBucharestParts();


    return (

      p.year +

      "-" +

      p.month +

      "-" +

      p.day

    );

  }



  function getCurrentMinutes() {

    const p =
      getBucharestParts();


    return (

      Number(p.hour) * 60 +

      Number(p.minute)

    );

  }



  function getDisplayDate() {

    const now =
      new Date();


    const time =
      new Intl.DateTimeFormat(
        "en-GB",
        {

          timeZone:
            TIME_ZONE,

          hour:
            "2-digit",

          minute:
            "2-digit",

          hour12:
            false

        }
      )
      .format(now);



    const fullDate =
      new Intl.DateTimeFormat(
        "en-US",
        {

          timeZone:
            TIME_ZONE,

          weekday:
            "long",

          month:
            "long",

          day:
            "numeric"

        }
      )
      .format(now);


    return {

      time:
        time,

      fullDate:
        fullDate

    };

  }



  /* =========================================================
     TIME HELPERS
     ========================================================= */

  function timeToMinutes(value) {

    if (!value) {

      return 0;

    }


    const pieces =
      value
        .split(":")
        .map(Number);


    return (

      (pieces[0] || 0) * 60 +

      (pieces[1] || 0)

    );

  }



  function formatTime(value) {

    if (!value) {

      return "";

    }


    return value.substring(
      0,
      5
    );

  }



  /* =========================================================
     ESCAPE HTML
     ========================================================= */

  function escapeHtml(value) {

    if (
      value === null ||
      value === undefined
    ) {

      return "";

    }


    return String(value)

      .replace(/&/g, "&amp;")

      .replace(/</g, "&lt;")

      .replace(/>/g, "&gt;")

      .replace(/"/g, "&quot;")

      .replace(/'/g, "&#039;");

  }



  /* =========================================================
     LOAD EVENTS
     ========================================================= */

  async function loadEvents() {

    const today =
      getTodayDateString();


    try {

      const url =

        SUPABASE_URL +

        "/rest/v1/events" +

        "?select=*" +

        "&event_date=eq." +

        encodeURIComponent(
          today
        ) +

        "&order=start_time.asc";


      const response =
        await fetch(
          url,
          {

            method:
              "GET",

            headers: {

              "apikey":
                SUPABASE_KEY,

              "Accept":
                "application/json"

            },

            cache:
              "no-store"

          }
        );


      if (!response.ok) {

        throw new Error(
          "Supabase returned " +
          response.status
        );

      }


      todayEvents =
        await response.json();


      lastLoadedDate =
        today;


      render();


    }

    catch (error) {

      console.error(
        error
      );


      renderError(
        "Unable to load events"
      );

    }

  }



  /* =========================================================
     CURRENT EVENT
     ========================================================= */

  function getCurrentEvent() {

    const now =
      getCurrentMinutes();


    return todayEvents.find(
      function(event) {

        const start =
          timeToMinutes(
            event.start_time
          );


        const end =
          timeToMinutes(
            event.end_time
          );


        return (

          now >= start &&

          now < end

        );

      }
    );

  }



  /* =========================================================
     REMAINING EVENTS
     ========================================================= */

  function getRemainingEvents() {

    const now =
      getCurrentMinutes();


    return todayEvents.filter(
      function(event) {

        const end =
          timeToMinutes(
            event.end_time
          );


        return (
          end > now
        );

      }
    );

  }



  /* =========================================================
     IDLE MODE
     ========================================================= */

  function renderIdle() {

    const app =
      document.getElementById(
        "app"
      );


    const d =
      getDisplayDate();


    const remaining =
      getRemainingEvents();


    const background =

      IDLE_BACKGROUND_URL +

      "?v=" +

      Math.floor(
        Date.now() /
        60000
      );


    let body = "";



    /* =======================================================
       AVAILABLE ALL DAY
       ======================================================= */

    if (
      remaining.length ===
      0
    ) {


      body = `

        <div
          class="no-events-wrapper"
        >

          <div

            class="no-events"

            style="
              ${textStyle(
                "idleAvailable"
              )}
            "

          >

            Available all day


            <div
              class="no-events-line"
            ></div>


          </div>

        </div>

      `;

    }



    /* =======================================================
       EVENT LIST
       ======================================================= */

    else {


      const rows =
        remaining
          .map(
            function(event) {

              return `

                <div
                  class="schedule-row"
                >


                  <div

                    class="schedule-time"

                    style="
                      ${scheduleTimeStyle()}
                    "

                  >

                    ${escapeHtml(
                      formatTime(
                        event.start_time
                      )
                    )}

                    –

                    ${escapeHtml(
                      formatTime(
                        event.end_time
                      )
                    )}

                  </div>


                  <div

                    class="schedule-title"

                    style="
                      ${scheduleTitleStyle()}
                    "

                  >

                    ${escapeHtml(
                      event.title
                    )}

                  </div>


                </div>

              `;

            }
          )
          .join("");


      body = `

        <div

          class="schedule-wrapper"

          style="
            ${scheduleWrapperStyle()}
          "

        >

          <div class="schedule">

            ${rows}

          </div>

        </div>

      `;

    }



    app.innerHTML = `

      <section

        class="idle-screen"

        style="
          background-image:
            url('${background}');
        "

      >


        <div class="idle-content">


          <div class="date-block">


            <div

              class="idle-clock"

              style="
                ${textStyle(
                  "idleClock"
                )}
              "

            >

              ${escapeHtml(
                d.time
              )}

            </div>


            <div

              class="date-single-line"

              style="
                ${textStyle(
                  "idleDate"
                )}
              "

            >

              ${escapeHtml(
                d.fullDate
              )}

            </div>


          </div>


          ${body}


        </div>


      </section>

    `;

  }



  /* =========================================================
     ACTIVE EVENT MODE
     ========================================================= */

  function renderActiveEvent(event) {

    const app =
      document.getElementById(
        "app"
      );


    const logo =
      event.logo_url || "";


    const background =
      event.background_url || "";


    let logoHtml = "";


    if (logo) {

      logoHtml = `

        <img

          class="event-logo"

          src="${escapeHtml(
            logo
          )}"

          alt=""

        >

      `;

    }


    else {

      logoHtml = `

        <div
          class="event-logo-placeholder"
        >

          ${escapeHtml(
            event.title
          )}

        </div>

      `;

    }



    const backgroundStyle =

      background

      ?

      `
        background-image:
          url('${escapeHtml(
            background
          )}');
      `

      :

      `
        background:
          linear-gradient(
            145deg,
            #16215B 0%,
            #0285FF 100%
          );
      `;



    app.innerHTML = `

      <section
        class="event-screen"
      >


        <div class="event-left">

          ${logoHtml}

        </div>



        <div

          class="event-right"

          style="
            ${backgroundStyle}
          "

        >


          <div class="event-top">


            <div

              class="event-title"

              style="
                ${textStyle(
                  "eventTitle"
                )}
              "

            >

              ${escapeHtml(
                event.title
              )}

            </div>



            <div

              class="event-time"

              style="
                ${textStyle(
                  "eventTime"
                )}
              "

            >

              ${escapeHtml(
                formatTime(
                  event.start_time
                )
              )}

              –

              ${escapeHtml(
                formatTime(
                  event.end_time
                )
              )}

            </div>


          </div>



          <div class="event-bottom">


            <div class="progress-box">


              <div

                class="progress-text"

                style="
                  ${textStyle(
                    "progressText"
                  )}
                "

              >

                IN PROGRESS

              </div>


            </div>


          </div>


        </div>


      </section>

    `;

  }



  /* =========================================================
     ERROR
     ========================================================= */

  function renderError(message) {

    document
      .getElementById(
        "app"
      )
      .innerHTML = `

        <div
          class="system-message"
        >

          ${escapeHtml(
            message
          )}

        </div>

      `;

  }



  /* =========================================================
     MAIN RENDER
     ========================================================= */

  function render() {

    const today =
      getTodayDateString();


    if (
      lastLoadedDate &&
      today !== lastLoadedDate
    ) {

      loadEvents();

      return;

    }


    const current =
      getCurrentEvent();


    if (current) {

      renderActiveEvent(
        current
      );

    }

    else {

      renderIdle();

    }

  }



  /* =========================================================
     START
     ========================================================= */

  async function start() {

    /*
       Load settings FIRST so the first
       render already uses correct values.
    */

    await loadDisplaySettings();


    await loadEvents();



    /*
       Clock and event transitions
       update every second.
    */

    setInterval(

      render,

      1000

    );



    /*
       Event database refresh.
    */

    setInterval(

      loadEvents,

      EVENT_REFRESH_INTERVAL

    );



    /*
       Admin display changes refresh
       every 3 seconds.

       loadDisplaySettings() itself
       calls render() after loading.
    */

    setInterval(

      loadDisplaySettings,

      SETTINGS_REFRESH_INTERVAL

    );

  }


  start();


</script>


</body>

</html>
